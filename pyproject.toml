[project]
name = "movie-roulette"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "letterboxdpy==6.6.1",
    "beautifulsoup4==4.15.0",
    "requests==2.34.2",
    "curl-cffi==0.16.3",
    "lxml==6.1.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # Line too long
    "SIM105", # Use contextlib.suppress
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
markers = [
    "smoke: live external integration tests touching real Letterboxd servers"
]
addopts = "-m 'not smoke'"
