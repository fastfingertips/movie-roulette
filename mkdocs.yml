site_name: Movie Roulette
site_url: https://docs.roulette.bugra.co/
site_description: Pick a random movie from one or more Letterboxd lists.
site_author: fastfingertips
repo_url: https://github.com/fastfingertips/movie-roulette
repo_name: fastfingertips/movie-roulette
edit_uri: edit/master/docs/

theme:
  name: material
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Usage:
    - Getting Started: usage/getting-started.md
    - Direct Redirect: usage/redirect.md
    - URL Parameters: usage/parameters.md
    - Integrations: usage/integrations.md
    - Keyboard Shortcuts: usage/keyboard.md
  - Reference:
    - JSON Response: reference/json.md
    - Internal API: reference/api.md
  - Self-Hosting:
    - Local Development: self-hosting/local.md
    - Vercel Deployment: self-hosting/vercel.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - pymdownx.snippets:
      check_paths: true

plugins:
  - search

