    <script>
        // Apply the saved theme (or the system color scheme) before first paint
        (function () {
            var themes = {
                'classic-light': 'light',
                'pine-orchid': 'light',
                'citron-berry': 'light',
                'forest-lime': 'light',
                'letterboxd-light': 'light',
                'amoled-light': 'light',
                'classic-dark': 'dark',
                'amoled': 'dark',
                'midnight-lime': 'dark',
                'letterboxd-dark': 'dark',
                'pine-orchid-dark': 'dark',
                'citron-berry-dark': 'dark'
            };
            var pairs = {
                'classic-light': 'classic-dark',
                'classic-dark': 'classic-light',
                'pine-orchid': 'pine-orchid-dark',
                'pine-orchid-dark': 'pine-orchid',
                'citron-berry': 'citron-berry-dark',
                'citron-berry-dark': 'citron-berry',
                'forest-lime': 'midnight-lime',
                'midnight-lime': 'forest-lime',
                'letterboxd-light': 'letterboxd-dark',
                'letterboxd-dark': 'letterboxd-light',
                'amoled-light': 'amoled',
                'amoled': 'amoled-light'
            };
            var savedMode = localStorage.getItem('theme_mode');
            var modePref = (savedMode === 'light' || savedMode === 'dark') ? savedMode : 'system';
            var darkOS = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var effectiveMode = modePref === 'system' ? (darkOS ? 'dark' : 'light') : modePref;

            var saved = localStorage.getItem('theme');
            var theme = (saved && themes[saved]) ? saved : (effectiveMode === 'dark' ? 'midnight-lime' : 'forest-lime');

            if (themes[theme] !== effectiveMode && pairs[theme]) {
                theme = pairs[theme];
            }

            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-mode', effectiveMode);
            document.documentElement.setAttribute('data-theme-mode', modePref);

            if (localStorage.getItem('movie_roulette_translucent') === 'false') {
                document.documentElement.setAttribute('data-solid-surfaces', 'true');
            }
        })();
    </script>

    <!-- How it Works Popup -->
    <div id="info-modal" class="modal-overlay is-hidden" role="dialog" aria-modal="true" aria-labelledby="info-modal-title">
        <template id="info-modal-tpl">
            <div class="modal-content modal-content--wide">
                <div class="modal-header">
                    <h2 class="modal-title" id="info-modal-title">How it Works</h2>
                    <button type="button" class="btn-link" id="close-modal-btn" name="close-modal">Close</button>
                </div>
                <div class="modal-grid">
                    <div class="modal-panel">
                        <div class="workflow">
                            <div class="workflow-step">
                                <div class="step-num">1</div>
                                <div class="step-body">
                                    <h3>Flexible Input Formats</h3>
                                    <p>You can mix up to 5 sources using any format:</p>
                                    <ul class="step-list">
                                        <li><strong>Username:</strong> <a href="https://letterboxd.com/bugracoskun/" target="_blank" rel="noopener" class="inline-link">bugracoskun</a> → spins from their Watchlist.</li>
                                        <li><strong>Shorthand:</strong> <a href="https://letterboxd.com/official/list/letterboxds-top-500-films/" target="_blank" rel="noopener" class="inline-link">official/letterboxds-top-500-films</a> → loads a specific list.</li>
                                        <li><strong>Full URL:</strong> Paste any full <a href="https://letterboxd.com/official/list/letterboxds-top-500-films/" target="_blank" rel="noopener" class="inline-link">letterboxd.com</a> link directly.</li>
                                        <li><strong>Watchlist vs List:</strong> Distinguishes standard watchlists from custom lists named <code>watchlist</code>.</li>
                                    </ul>
                                </div>
                            </div>
                            <div class="workflow-step">
                                <div class="step-num">2</div>
                                <div class="step-body">
                                    <h3>Live Badges & Ratio Borders</h3>
                                    <p>Each field is inspected and enriched as you type:</p>
                                    <ul class="step-list">
                                        <li>Shows real-time <strong>Watchlist</strong> or <strong>List</strong> badges with live film counts.</li>
                                        <li>Displays dynamic <strong>odds percentages</strong> and animated <strong>ratio border bars</strong>.</li>
                                        <li>Surfaces detailed error tooltips if a user or list is private or not found.</li>
                                        <li>Automatically catches and warns about duplicate list entries.</li>
                                    </ul>
                                </div>
                            </div>
                            <div class="workflow-step">
                                <div class="step-num">3</div>
                                <div class="step-body">
                                    <h3>Dual Random & Sampling Modes</h3>
                                    <p>Control your selection algorithm and list odds:</p>
                                    <ul class="step-list">
                                        <li><strong>Deep Sample (Default):</strong> Multi-page uniform sampling across the entire catalog depth. Fast, reliable, and Cloudflare-safe.</li>
                                        <li><strong>Use /shuffle (Toggle):</strong> Opt-in to Letterboxd's native <code>/by/shuffle</code> view (samples from Page 1).</li>
                                        <li><strong>Equal Odds (Scale Toggle):</strong> Each list gets an equal 1/N chance of being selected first when combining multiple lists.</li>
                                    </ul>
                                </div>
                            </div>
                            <div class="workflow-step">
                                <div class="step-num">4</div>
                                <div class="step-body">
                                    <h3>Auto-Shorten & Sync</h3>
                                    <p>Pasted full URLs are neatly formatted:</p>
                                    <ul class="step-list">
                                        <li>Long URLs are automatically shortened using a smooth typewriter animation.</li>
                                        <li>The canonical URL is preserved below the input for reference.</li>
                                        <li>Your active mix automatically syncs to the address bar for easy bookmarking.</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-panel">
                        <div class="workflow">
                            <div class="workflow-step">
                                <div class="step-num">5</div>
                                <div class="step-body">
                                    <h3>Mixes & Share Links</h3>
                                    <p>Combine favorite lists to create custom cinematic blends:</p>
                                    <ul class="step-list">
                                        <li><strong>Combine Sources:</strong> Add up to 5 lists to draw random picks across multiple tastes simultaneously.</li>
                                        <li><strong>Share Mix:</strong> Click <strong>Share Mix</strong> to copy a shareable blend link to your clipboard.</li>
                                        <li><strong>URL Parameter:</strong> Instant sharing with clean parameter syntax: <a href="?url=official/letterboxds-top-500-films,official/top-250-horror-films" class="inline-link">?url=official/letterboxds-top-500-films,...</a></li>
                                    </ul>
                                </div>
                            </div>
                            <div class="workflow-step">
                                <div class="step-num">6</div>
                                <div class="step-body">
                                    <h3>Recent Lists & History</h3>
                                    <p>Your activity is persisted locally in your browser:</p>
                                    <ul class="step-list">
                                        <li><strong>Recent Lists:</strong> Quick-access chips show inclusion status (<code>#1</code>, <code>#2</code>) — click to add or remove.</li>
                                        <li><strong>Activity Log:</strong> Saves your last 4 spins with timestamps, list sources, and Letterboxd links.</li>
                                        <li><strong>Keyboard Support:</strong> Navigate recent chips with <kbd>Tab</kbd> and toggle with <kbd>Enter</kbd> or <kbd>Space</kbd>.</li>
                                    </ul>
                                </div>
                            </div>
                            <div class="workflow-step">
                                <div class="step-num">7</div>
                                <div class="step-body">
                                    <h3>Technical Logs & Waterfall</h3>
                                    <p>Inspect exact diagnostics for every spin:</p>
                                    <ul class="step-list">
                                        <li>Click the <strong>info icon</strong> on the result card to view technical logs.</li>
                                        <li>Review exact probability percentages, pool breakdown, and winner verification.</li>
                                        <li>Inspect pipeline execution waterfall timings (Metadata → Selection → Film Enrichment).</li>
                                    </ul>
                                </div>
                            </div>
                            <div class="workflow-step">
                                <div class="step-num">8</div>
                                <div class="step-body">
                                    <h3>Privacy & 12 Custom Themes</h3>
                                    <p>Fast, lightweight, and customizable:</p>
                                    <ul class="step-list">
                                        <li><strong>100% Local Storage:</strong> Zero tracking, zero third-party analytics, and no server cookies.</li>
                                        <li><strong>12 Curated Themes:</strong> Switch between Classic, Pine &amp; Orchid, Citron &amp; Berry, Forest &amp; Midnight Lime, Letterboxd, and AMOLED (Light &amp; Dark pairs) with optional solid or translucent surfaces.</li>
                                        <li><strong>Open Source:</strong> Transparent and publicly hosted on <a href="https://github.com/fastfingertips/movie-roulette" target="_blank" rel="noopener" class="inline-link">GitHub</a>.</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
