target-version = "py312"
line-length = 88

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "PIE", # flake8-pie
    "RUF", # Ruff-specific rules
]
ignore = [
    "SIM105", # Use contextlib.suppress
]

[lint.per-file-ignores]
"tests/*" = ["S101"]
